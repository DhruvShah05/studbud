name: Deploy Backend to AWS Elastic Beanstalk

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests (if any)
        run: |
          cd backend
          # Add your test commands here
          # python -m pytest tests/

      - name: Generate deployment package
        run: |
          cd backend
          zip -r deploy.zip . -x "*.git*" "*.env" "__pycache__/*" "*.pyc" "venv/*" "uploads/*" "audio_outputs/*"

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v21
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: studbud-backend
          environment_name: studbud-backend-prod
          version_label: ${{ github.sha }}
          region: us-east-1
          deployment_package: backend/deploy.zip
          wait_for_deployment: true
          wait_for_environment_recovery: 300

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Backend deployed successfully!"
          else
            echo "❌ Backend deployment failed!"
          fi
